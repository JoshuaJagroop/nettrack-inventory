<!-- login.html -->
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>NetTrack - Login</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="auth-container">
        <h2>NetTrack Login</h2>
        <form action="dashboard.html" method="GET">
            <div class="form-group">
                <label for="email">Admin Email:</label>
                <input type="email" id="email" name="email" required>
            </div>
            <div class="form-group">
                <label for="password">Password:</label>
                <input type="password" id="password" name="password" required>
            </div>
            <div class="form-group">
                <label for="mfa">MFA Token (Optional for now):</label>
                <input type="text" id="mfa" name="mfa">
            </div>
            <button type="submit">SECURE LOGIN</button>
        </form>
        <p style="text-align: center; margin-top: 15px; font-size: 0.85rem;">
            Need an account? <a href="register.html" style="color: #38bdf8;">Register Here</a>
        </p>
    </div>
<script>
document.querySelector('form').addEventListener('submit', async (e) => {
  e.preventDefault();
  const res = await fetch('/api/login', {
    method: 'POST',
    headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify({
      email: document.getElementById('email').value,
      password: document.getElementById('password').value
    })
  });
  const data = await res.json();
  if (res.ok) {
    window.location.href = 'dashboard.html';
  } else {
    alert(data.error);
  }
});
</script>
</body>
</html>
